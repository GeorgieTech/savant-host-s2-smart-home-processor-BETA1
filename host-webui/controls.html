<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRYPT">
<title>CRYPT — Relays</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/crypt.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>CRYPT</h1>
      <div class="sub">Relays</div>
    </div>
    <div class="hostline" id="hostline">Finding expanders…</div>
  </header>
  <main class="page">
    <div class="err" id="err"></div>
    <div class="okline" id="ok"></div>
    <div id="devices"></div>
  </main>
  <nav class="tabbar">
    <a href="/">Playing</a>
    <a href="/library">Library</a>
    <a href="/karaoke">Karaoke</a>
    <a href="/eq">EQ</a>
    <a class="on" href="/controls">Relays</a>
  </nav>
</div>
<script>
const $ = (id) => document.getElementById(id);
let busy = {};
let last = { devices: [] };

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

function coilRow(dev, r) {
  const on = !!r.on;
  const locked = !!busy[dev.id] || !dev.cli;
  const el = document.createElement("div");
  el.className = "coil" + (on ? " hot" : "");
  el.innerHTML =
    '<div class="lamp"></div>' +
    '<div><div class="name">Relay ' + r.relay + '</div>' +
    '<div class="port">port ' + r.port + (on ? " · on" : " · off") +
    (r.count != null ? " · " + r.count + " cycles" : "") + "</div></div>";
  const sw = document.createElement("button");
  sw.className = "switch" + (on ? " on" : "");
  sw.setAttribute("aria-label", "Relay " + r.relay);
  sw.setAttribute("aria-pressed", on ? "true" : "false");
  sw.disabled = locked;
  sw.onclick = () => setRelay(dev.id, r.relay, !on);
  el.appendChild(sw);
  return el;
}

function deviceCard(dev) {
  const card = document.createElement("section");
  card.className = "card";
  const cli = !!dev.cli;
  const seen = !!dev.seen || cli;
  const locked = !!busy[dev.id] || !cli;
  let badge = "dead";
  let badgeText = "Offline";
  if (cli) { badge = "live"; badgeText = dev.uplinked || dev.gpio_host ? "Uplinked" : "Online"; }
  else if (seen) { badge = "seen"; badgeText = "Seen"; }
  const bits = [dev.model || "SSC", dev.host || ""];
  if (dev.uid) bits.push(dev.uid);
  if (dev.fw) bits.push("FW " + dev.fw);
  if (dev.uptime) bits.push(dev.uptime);
  if (dev.uplinked_ip && dev.uplinked_ip !== "0.0.0.0") bits.push("uplink " + dev.uplinked_ip);
  const head = document.createElement("div");
  head.className = "device-head";
  head.innerHTML =
    "<div><h2>" + esc(dev.title || dev.model) + "</h2></div>" +
    "<span class='badge " + badge + "'>" + badgeText + "</span>";
  card.appendChild(head);
  const ident = document.createElement("p");
  ident.className = "ident";
  ident.textContent = bits.filter(Boolean).join(" · ");
  if (dev.error && !online) ident.textContent += " · " + dev.error;
  card.appendChild(ident);
  const row = document.createElement("div");
  row.className = "row";
  const allOn = document.createElement("button");
  allOn.className = "primary";
  allOn.textContent = "All on";
  allOn.disabled = locked;
  allOn.onclick = () => setAll(dev.id, true);
  const allOff = document.createElement("button");
  allOff.className = "release";
  allOff.textContent = "All off";
  allOff.disabled = locked;
  allOff.onclick = () => setAll(dev.id, false);
  const refresh = document.createElement("button");
  refresh.className = "ghost";
  refresh.textContent = "Refresh";
  refresh.disabled = !!busy[dev.id];
  refresh.onclick = () => tick(true);
  row.appendChild(allOn);
  row.appendChild(allOff);
  row.appendChild(refresh);
  card.appendChild(row);
  const coils = document.createElement("div");
  coils.className = "coils";
  coils.style.marginTop = "12px";
  const relays = (dev.relays && dev.relays.length)
    ? dev.relays
    : Array.from({length: dev.relays ? dev.relays.length : 0}, (_, i) => ({relay: i+1, port: i, on: false}));
  relays.forEach((r) => coils.appendChild(coilRow(dev, r)));
  card.appendChild(coils);
  return card;
}

function render(st) {
  last = st || { devices: [] };
  const devices = last.devices || [];
  const live = devices.filter((d) => d.online).length;
  $("hostline").textContent = live + " / " + devices.length + " expanders online";
  const box = $("devices");
  box.innerHTML = "";
  devices.forEach((d) => box.appendChild(deviceCard(d)));
  if (!devices.length) {
    box.innerHTML = "<section class='card'><p class='hint'>No expanders configured.</p></section>";
  }
}

async function tick(force) {
  try {
    const r = await fetch("/api/ssc" + (force ? "?fresh=1" : ""));
    const st = await r.json();
    $("err").textContent = "";
    render(st);
  } catch (e) {
    $("err").textContent = "Host is not answering";
  }
}

async function setRelay(id, n, on) {
  busy[id] = true;
  $("ok").textContent = (on ? "Turning on" : "Turning off") + " " + id + " relay " + n + "…";
  try {
    if (navigator.vibrate) navigator.vibrate(8);
    const r = await fetch("/api/ssc/" + encodeURIComponent(id) + "/relay", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ relay: n, on: on })
    });
    const st = await r.json();
    if (!st.ok) throw new Error(st.error || "failed");
    $("ok").textContent = "Relay " + n + (on ? " on" : " off");
    const devices = (last.devices || []).map((d) => d.id === id ? st : d);
    render({ devices: devices });
  } catch (e) {
    $("err").textContent = e.message;
    await tick(true);
  } finally {
    busy[id] = false;
    render(last);
  }
}

async function setAll(id, on) {
  busy[id] = true;
  $("ok").textContent = (on ? "Turning on" : "Turning off") + " all relays on " + id + "…";
  try {
    if (navigator.vibrate) navigator.vibrate(8);
    const r = await fetch("/api/ssc/" + encodeURIComponent(id) + "/relays", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ on: on })
    });
    const st = await r.json();
    if (!st.ok) throw new Error(st.error || "failed");
    $("ok").textContent = on ? "All on" : "All off";
    const devices = (last.devices || []).map((d) => d.id === id ? st : d);
    render({ devices: devices });
  } catch (e) {
    $("err").textContent = e.message;
    await tick(true);
  } finally {
    busy[id] = false;
    render(last);
  }
}

tick(true);
setInterval(() => {
  if (Object.values(busy).some(Boolean)) return;
  tick(false);
}, 2500);
</script>
</body>
</html>
