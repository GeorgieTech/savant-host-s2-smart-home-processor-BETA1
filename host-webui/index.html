<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRYPT">
<title>CRYPT — Playing</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/crypt.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>CRYPT</h1>
      <div class="sub">S2 · BETA1</div>
    </div>
    <div class="hostline" id="hostline">Connecting…</div>
  </header>
  <main class="page">
    <section class="card nowcard">
      <div class="section-head">
        <h2>What’s playing</h2>
        <span class="badge" id="state">Idle</span>
      </div>
      <div class="viz-wrap" id="vizwrap">
        <canvas id="viz" aria-label="Playback visualizer"></canvas>
        <audio id="tap" playsinline webkit-playsinline preload="auto"></audio>
      </div>
      <div class="now" id="now">Nothing playing</div>
      <div class="meta" id="meta">0:00 / 0:00</div>
      <div class="bar" id="seek"><span id="fill"></span></div>
      <div class="transport">
        <button class="icon" onclick="api('/api/prev')" aria-label="Previous">⟨⟨</button>
        <button class="playbig primary" id="playbtn" onclick="toggle()">Play</button>
        <button class="icon" onclick="api('/api/next')" aria-label="Next">⟩⟩</button>
      </div>
      <div class="row center">
        <button class="ghost" onclick="api('/api/stop')">Stop</button>
      </div>
      <div class="vol">Volume <input id="vol" type="range" min="0" max="100" value="100"></div>
      <div class="err" id="err"></div>
    </section>
    <section class="card">
      <div class="section-head">
        <h2>Up next</h2>
        <span class="meta tight" id="qmeta"></span>
      </div>
      <ol class="queue" id="queue"></ol>
      <a class="morelink" id="qmore" href="/library" hidden></a>
    </section>
  </main>
  <nav class="tabbar">
    <a class="on" href="/">Playing</a>
    <a href="/library">Library</a>
    <a href="/eq">EQ</a>
    <a href="/controls">Relays</a>
  </nav>
</div>
<script>
const $ = (id) => document.getElementById(id);
let last = {};
let viz = {
  seed: 1,
  clock: 0,
  lastTs: 0,
  raf: 0,
  vol: 1,
  mode: "idle",
  bars: null,
  live: false
};
const tap = {
  audio: $("tap"),
  ctx: null,
  analyser: null,
  freq: null,
  src: null,
  gain: null,
  name: "",
  ok: false
};

function fmt(sec) {
  sec = Math.max(0, sec || 0);
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function titleOf(name) {
  return String(name || "").replace(/\.[^.]+$/, "").replace(/[_]+/g, " ");
}
function hashName(s) {
  let h = 2166136261;
  const t = String(s || "crypt");
  for (let i = 0; i < t.length; i++) {
    h ^= t.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0) || 1;
}
async function api(path, body) {
  const opt = body === undefined ? { method: "POST" } : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  };
  const r = await fetch(path, opt);
  return r.json();
}
function unlockAudio() {
  if (!tap.audio) return false;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  if (!tap.ctx) {
    tap.ctx = new AC();
    tap.analyser = tap.ctx.createAnalyser();
    tap.analyser.fftSize = 512;
    tap.analyser.smoothingTimeConstant = 0.68;
    tap.freq = new Uint8Array(tap.analyser.frequencyBinCount);
    tap.gain = tap.ctx.createGain();
    tap.gain.gain.value = 0;
    tap.src = tap.ctx.createMediaElementSource(tap.audio);
    tap.src.connect(tap.analyser);
    tap.analyser.connect(tap.gain);
    tap.gain.connect(tap.ctx.destination);
  }
  if (tap.ctx.state === "suspended") tap.ctx.resume();
  return true;
}
function mediaUrl(name) {
  return "/api/media?name=" + encodeURIComponent(name);
}
function syncTap(p, playing) {
  if (!tap.audio) return;
  if (!p || !p.name) {
    tap.name = "";
    tap.ok = false;
    try { tap.audio.pause(); } catch (e) {}
    return;
  }
  unlockAudio();
  if (tap.name !== p.name) {
    tap.name = p.name;
    tap.ok = false;
    tap.audio.src = mediaUrl(p.name);
    try { tap.audio.load(); } catch (e) {}
  }
  const pos = p.position || 0;
  try {
    if (Math.abs((tap.audio.currentTime || 0) - pos) > 0.45) {
      tap.audio.currentTime = pos;
    }
  } catch (e) {}
  if (playing) {
    const pr = tap.audio.play();
    if (pr && pr.catch) pr.catch(function () {});
  } else {
    try { tap.audio.pause(); } catch (e) {}
  }
}
async function toggle() {
  unlockAudio();
  const p = last.player || {};
  if (p.playing) await api("/api/pause");
  else if (p.paused) await api("/api/resume");
  else if (p.name) await api("/api/play", { name: p.name });
  else if ((last.count || 0) > 0) await api("/api/next");
  tick();
}
async function playName(name) { unlockAudio(); await api("/api/play", { name }); tick(); }
let volUser = false;
let volPending = null;
let volBusy = false;
function setVol(n) {
  n = Math.max(0, Math.min(100, Number(n)));
  viz.vol = n / 100;
  volPending = n;
  pumpVol();
}
function pumpVol() {
  if (volBusy || volPending == null) return;
  const n = volPending;
  volPending = null;
  volBusy = true;
  api("/api/volume", { n: n }).finally(() => {
    volBusy = false;
    if (volPending != null) pumpVol();
  });
}
$("vol").addEventListener("input", (e) => setVol(e.target.value));
$("vol").addEventListener("change", (e) => setVol(e.target.value));
$("vol").addEventListener("pointerdown", () => { volUser = true; });
$("vol").addEventListener("pointerup", () => { volUser = false; });
$("vol").addEventListener("pointercancel", () => { volUser = false; });
$("vol").addEventListener("touchstart", () => { volUser = true; }, { passive: true });
$("vol").addEventListener("touchend", () => { volUser = false; });

$("seek").addEventListener("click", (e) => {
  const p = last.player || {};
  if (!p.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  const t = ((e.clientX - r.left) / r.width) * p.duration;
  api("/api/seek", { seconds: t }).then(tick);
});
$("viz").addEventListener("click", () => { unlockAudio(); toggle(); });
document.addEventListener("pointerdown", unlockAudio);
tap.audio.addEventListener("playing", () => { tap.ok = true; });
tap.audio.addEventListener("error", () => { tap.ok = false; });

function sizeViz() {
  const c = $("viz");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = c.clientWidth || 320;
  const h = c.clientHeight || 200;
  const tw = Math.max(1, Math.floor(w * dpr));
  const th = Math.max(1, Math.floor(h * dpr));
  if (c.width !== tw) c.width = tw;
  if (c.height !== th) c.height = th;
}

function fftLevels(nBars) {
  if (!tap.analyser || !tap.freq || !tap.ok) return null;
  tap.analyser.getByteFrequencyData(tap.freq);
  const n = tap.freq.length;
  let energy = 0;
  const out = new Float32Array(nBars);
  const minB = 1;
  const usable = Math.max(1, n - minB);
  for (let i = 0; i < nBars; i++) {
    const a = minB + Math.floor(Math.pow(i / nBars, 1.55) * usable);
    const b = minB + Math.floor(Math.pow((i + 1) / nBars, 1.55) * usable);
    const lo = Math.min(a, n - 1);
    const hi = Math.max(lo + 1, Math.min(n, b));
    let s = 0;
    for (let k = lo; k < hi; k++) s += tap.freq[k];
    const v = (s / (hi - lo)) / 255;
    out[i] = v;
    energy += v;
  }
  return out;
}

function drawViz(ts) {
  viz.raf = requestAnimationFrame(drawViz);
  const c = $("viz");
  const ctx = c.getContext("2d");
  if (!ctx) return;
  sizeViz();
  const w = c.width;
  const h = c.height;
  const dt = viz.lastTs ? Math.min(0.05, (ts - viz.lastTs) / 1000) : 0.016;
  viz.lastTs = ts;
  if (viz.mode === "play") viz.clock += dt;
  else if (viz.mode === "idle") viz.clock += dt * 0.18;

  const bars = 48;
  if (!viz.bars || viz.bars.length !== bars) viz.bars = new Float32Array(bars);
  const live = fftLevels(bars);
  viz.live = !!live && viz.mode === "play";
  const seed = viz.seed;
  const t = viz.clock;
  let energy = 0.08;
  for (let i = 0; i < bars; i++) {
    let target;
    if (live) {
      target = Math.pow(live[i], 0.85);
    } else if (viz.mode === "pause") {
      target = viz.bars[i] * 0.985;
    } else {
      const mid = (bars - 1) / 2;
      const bass = 1 - Math.abs(i - mid) / mid * 0.72;
      const n1 = 0.5 + 0.5 * Math.sin(t * (1.15 + (seed % 5) * 0.13) + i * 0.37);
      const n2 = 0.5 + 0.5 * Math.sin(t * (2.4 + (i % 7) * 0.11) + seed * 0.01 + i * 0.19);
      target = (0.18 + 0.5 * n1 * n2) * bass * (viz.mode === "play" ? 0.28 : 0.1);
    }
    const mix = live ? 0.42 : 0.22;
    viz.bars[i] = viz.bars[i] * (1 - mix) + target * mix;
    energy += viz.bars[i];
  }
  energy = Math.max(0.06, Math.min(1, energy / bars * (live ? 2.2 : 1)));
  const gap = Math.max(1, w * 0.006);
  const bw = (w - gap * (bars + 1)) / bars;

  ctx.clearRect(0, 0, w, h);
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "rgba(155,28,28,0.16)");
  g.addColorStop(0.55, "rgba(7,6,10,0.08)");
  g.addColorStop(1, "rgba(7,6,10,0.92)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h * 0.58;
  const rg = ctx.createRadialGradient(cx, cy, 4, cx, cy, h * 0.7);
  rg.addColorStop(0, "rgba(224,122,58," + (0.18 + energy * 0.35) + ")");
  rg.addColorStop(0.35, "rgba(155,28,28," + (0.12 + energy * 0.18) + ")");
  rg.addColorStop(1, "rgba(7,6,10,0)");
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, w, h);

  for (let i = 0; i < bars; i++) {
    const amp = Math.max(0.04, viz.bars[i]);
    const bh = Math.max(h * 0.04, amp * h * 0.9);
    const x = gap + i * (bw + gap);
    const y = h - bh - h * 0.08;
    const bar = ctx.createLinearGradient(0, y, 0, h);
    bar.addColorStop(0, "#f3c07a");
    bar.addColorStop(0.35, "#e07a3a");
    bar.addColorStop(1, "#5c1010");
    ctx.fillStyle = bar;
    ctx.globalAlpha = 0.55 + energy * 0.45;
    ctx.fillRect(x, y, Math.max(1, bw), bh);
  }
  ctx.globalAlpha = 1;

  ctx.beginPath();
  ctx.arc(cx, cy, 6 + energy * 10, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(243,230,200," + (0.35 + energy * 0.45) + ")";
  ctx.fill();
}

function startViz() {
  if (viz.raf) return;
  viz.lastTs = 0;
  viz.raf = requestAnimationFrame(drawViz);
}
function stopViz() {
  if (viz.raf) cancelAnimationFrame(viz.raf);
  viz.raf = 0;
}

function renderQueue(st) {
  const ul = $("queue");
  ul.innerHTML = "";
  const items = st.queue || [];
  const total = st.queue_total || 0;
  $("qmeta").textContent = total ? Math.min(items.length, 5) + " of " + total : "";
  if (!items.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.innerHTML = (st.count || 0)
      ? "<span class='name'>End of the queue</span>"
      : "<span class='name'>Nothing queued — add tracks in Library</span>";
    ul.appendChild(li);
    $("qmore").hidden = true;
    return;
  }
  items.slice(0, 5).forEach((t, i) => {
    const li = document.createElement("li");
    li.innerHTML =
      "<span class='idx'>" + (i + 1) + "</span>" +
      "<span class='name'>" + esc(titleOf(t.name)) + "</span>";
    li.onclick = () => playName(t.name);
    ul.appendChild(li);
  });
  if (total > items.length) {
    $("qmore").hidden = false;
    $("qmore").textContent = (total - items.length) + " more in Library →";
  } else {
    $("qmore").hidden = true;
  }
}

async function tick() {
  try {
    const st = await (await fetch("/api/status")).json();
    last = st;
    const p = st.player || {};
    const playing = !!p.playing;
    const paused = !!p.paused;
    viz.seed = hashName(p.name || st.host || "crypt");
    viz.mode = playing ? "play" : paused ? "pause" : "idle";
    viz.vol = ((st.volume == null ? 100 : st.volume) / 100);
    syncTap(p, playing);
    $("hostline").textContent = (st.model || "SHR-S2") + " · TOSLINK";
    $("now").textContent = p.name ? titleOf(p.name) : "Nothing playing";
    $("meta").textContent = fmt(p.position) + " / " + fmt(p.duration);
    $("fill").style.width = (p.duration ? (100 * p.position / p.duration) : 0) + "%";
    $("playbtn").textContent = playing ? "Pause" : "Play";
    $("err").textContent = p.error || "";
    if (!volUser) $("vol").value = st.volume == null ? 100 : st.volume;
    const badge = $("state");
    badge.className = "badge " + (playing ? "live" : paused ? "seen" : "dead");
    badge.textContent = playing ? "Playing" : paused ? "Paused" : "Idle";
    $("vizwrap").classList.toggle("live", playing);
    document.body.classList.toggle("is-playing", playing);
    renderQueue(st);
  } catch (e) {
    $("err").textContent = "Host is not answering";
    viz.mode = "idle";
  }
}

window.addEventListener("resize", sizeViz);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    stopViz();
    try { tap.audio.pause(); } catch (e) {}
  } else {
    startViz();
    tick();
  }
});
startViz();
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
